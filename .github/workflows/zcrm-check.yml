name: ZCRM checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      # Synchronize the npm lockfile after replacing the editor dependencies.
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit updated npm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m "chore: synchronize Tiptap lockfile"
            git push
          fi
      - run: npm ci
      - run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs storage/app/private storage/app/public
      - run: |
          php artisan route:list --path=projects
          php artisan wayfinder:generate --with-form -vvv
      - run: |
          find app database/migrations routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
          npm run types
          npm run build
      - run: |
          php artisan test --compact
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
